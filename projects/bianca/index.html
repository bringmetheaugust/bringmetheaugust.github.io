<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
		<link rel="stylesheet" href="index.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet" />
		<title>Bianca under the snow</title>
	</head>
	<body>
		<audio id="melody" autoplay src="melody.mp3"></audio>
		<div class="text">
			<p>
				Eu sei que você nunca viu neve. A neve é ​​fria e derrete rapidamente ao tocar suas mãos. Essa neve
				nunca desaparecerá e cairá para sempre enquanto você olhar para ela.
			</p>
			<p>Você ainda não sabe quem é e quanto vale. Espero que um dia entenda isso.</p>
		</div>
		<div id="app"></div>
		<footer>
			<div class="me">em memória de August</div>
			<svg
				version="1.1"
				id="melody-play"
				xmlns="http://www.w3.org/2000/svg"
				xmlns:xlink="http://www.w3.org/1999/xlink"
				x="0px"
				y="0px"
				width="24px"
				height="24px"
				viewBox="0 0 24 24"
				xml:space="preserve"
			>
				<rect x="0" y="0" width="4" height="7" fill="#fff">
					<animateTransform
						attributeType="xml"
						attributeName="transform"
						type="scale"
						values="1,1; 1,2; 1,1"
						begin="0s"
						dur="1.5s"
						repeatCount="indefinite"
					></animateTransform>
				</rect>
				<rect x="10" y="0" width="4" height="7" fill="#fff">
					<animateTransform
						attributeType="xml"
						attributeName="transform"
						type="scale"
						values="1,1; 1,2; 1,1"
						begin="0.4s"
						dur="1.5s"
						repeatCount="indefinite"
					></animateTransform>
				</rect>
				<rect x="20" y="0" width="4" height="7" fill="#fff">
					<animateTransform
						attributeType="xml"
						attributeName="transform"
						type="scale"
						values="1,1; 1,2; 1,1"
						begin="0.7s"
						dur="1.5s"
						repeatCount="indefinite"
					></animateTransform>
				</rect>
			</svg>
		</footer>
		<script type="module" src="index.js"></script>
		<script>
			document.getElementById("melody-play").addEventListener("click", e => {
				document.getElementById("melody").play()
				e.currentTarget.style.opacity = "0"
				e.currentTarget.style.pointerEvents = "none"
			})
		</script>
	</body>
</html>
